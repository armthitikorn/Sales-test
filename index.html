<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Telesales & Compliance Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .mic-active { animation: pulse 1.5s infinite; background-color: #ef4444 !important; }
        @keyframes pulse { 
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 
            70% { transform: scale(1.08); box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); } 
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } 
        }
        .chat-area { height: calc(100vh - 280px); }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Welcome Screen -->
    <div id="welcome-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 text-white p-6 text-center">
        <div class="max-w-sm w-full">
            <h1 class="text-3xl font-bold mb-3 text-blue-400">Telesales Simulator</h1>
            <p class="text-xs text-slate-400 mb-2">ระบบจำลองสายโทรศัพท์ฝึกขายและตรวจ Compliance 2026</p>
            <p class="mb-8 text-amber-400 text-xs font-semibold">🔊 กรุณาเปิดเสียงโทรศัพท์ของคุณให้สุด</p>
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-500 text-white w-full py-4 rounded-full text-lg font-bold shadow-lg transition-all active:scale-95">
                เริ่มต้นการฝึกซ้อม
            </button>
        </div>
    </div>

    <!-- Header Bar -->
    <header class="p-4 bg-white border-b flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center gap-3">
            <div id="avatar" class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold">P</div>
            <div>
                <h2 id="display-name" class="font-bold text-slate-800 text-sm">คุณเปรมวดี</h2>
                <span class="text-[10px] text-green-500 font-bold uppercase tracking-wider">● Live Call</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <select id="level-select" class="bg-slate-100 border border-slate-200 rounded-lg px-2 py-1.5 text-xs font-medium outline-none">
                <option value="1">Level 1: คุณเปรมวดี (สุภาพ/เป๊ะ)</option>
                <option value="2">Level 2: คุณสมเกียรติ (สุขุม/เหตุผล)</option>
                <option value="3">Level 3: คุณฤทัย (ฝ่ายกฎหมาย/ตรง)</option>
                <option value="4">Level 4: คุณฐิติกร (CEO/นิ่ง/สั้น)</option>
            </select>
            <button id="end-call-btn" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold uppercase transition-all active:scale-95">
                จบการขาย
            </button>
        </div>
    </header>

    <!-- Chat Messages Window -->
    <main id="chat-window" class="chat-area overflow-y-auto p-4 flex flex-col gap-3"></main>

    <!-- Control Footer -->
    <footer class="p-5 bg-white border-t flex flex-col items-center gap-2 shadow-inner">
        <button id="mic-btn" class="w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-xl transition-all active:scale-90 touch-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
            </svg>
        </button>
        <p id="instruction" class="text-slate-500 text-xs font-medium">แตะปุ่มไมค์เพื่อเริ่มพูด</p>
        <div id="user-transcript" class="text-blue-600 text-[11px] italic h-4 text-center overflow-hidden"></div>
    </footer>

    <!-- Modal Evaluation Result -->
    <div id="eval-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl p-6 space-y-4 max-h-[90vh] flex flex-col">
            <h3 class="text-xl font-bold text-center text-slate-800">ผลการประเมินการขาย (QC 2026)</h3>
            
            <div class="flex justify-center my-2">
                <div class="w-24 h-24 rounded-full bg-blue-50 flex flex-col items-center justify-center border-4 border-blue-600 shadow-inner">
                    <span id="score-val" class="text-3xl font-black text-blue-600">0</span>
                    <span class="text-[9px] text-slate-400 font-bold uppercase">คะแนนเต็ม 100</span>
                </div>
            </div>

            <div id="eval-details" class="space-y-3 text-xs text-slate-600 overflow-y-auto pr-1 flex-1"></div>

            <button onclick="location.reload()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-xl font-bold transition-all active:scale-95 mt-2">
                ฝึกซ้อมใหม่อีกครั้ง
            </button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const micBtn = document.getElementById('mic-btn');
        const instruction = document.getElementById('instruction');
        const userTranscript = document.getElementById('user-transcript');
        const levelSelect = document.getElementById('level-select');
        const displayName = document.getElementById('display-name');
        const avatar = document.getElementById('avatar');
        const endCallBtn = document.getElementById('end-call-btn');
        const welcomeScreen = document.getElementById('welcome-screen');

        const charData = {
            "1": { name: "คุณเปรมวดี", initial: "P", color: "bg-blue-600", intro: "ฮัลโหลค่ะ... สวัสดีค่ะ? เปรมวดีพูดสายอยู่ค่ะ" },
            "2": { name: "คุณสมเกียรติ", initial: "S", color: "bg-slate-700", intro: "ครับ สวัสดีครับ สมเกียรติรับสายครับ" },
            "3": { name: "คุณฤทัย", initial: "R", color: "bg-pink-600", intro: "ฮัลโหล! ใครคะเนี่ย? พอดีติดงานอยู่ มีอะไรไหมคะ?" },
            "4": { name: "คุณฐิติกร", initial: "T", color: "bg-amber-600", intro: "สวัสดี ฐิติกรพูดสาย มีอะไรว่ามา" }
        };

        let history = [];
        let activeRecognition = null;
        let isProcessing = false;
        let currentBlobUrl = null;

        const audioPlayer = new Audio();
        audioPlayer.setAttribute('playsinline', '');

        function playBase64Audio(b64Data) {
            try {
                if (currentBlobUrl) {
                    URL.revokeObjectURL(currentBlobUrl);
                }
                const byteCharacters = atob(b64Data);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: 'audio/mp3' });
                currentBlobUrl = URL.createObjectURL(blob);
                
                audioPlayer.src = currentBlobUrl;
                audioPlayer.play().catch(e => console.warn("Audio playback exception:", e));
            } catch (e) {
                console.error("Audio processing failed:", e);
            }
        }

        function createNewRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("เบราว์เซอร์ของคุณไม่รองรับการบันทึกเสียง");
                return null;
            }

            const rec = new SpeechRecognition();
            rec.lang = 'th-TH';
            rec.interimResults = false;
            rec.continuous = false;

            rec.onstart = () => {
                micBtn.classList.add('mic-active');
                instruction.innerText = "กำลังฟังเสียงของคุณ...";
            };

            rec.onresult = (event) => {
                const text = event.results[0][0].transcript;
                userTranscript.innerText = `คุณพูดว่า: "${text}"`;
                if (!isProcessing && text.trim() !== "") {
                    isProcessing = true;
                    sendToAI(text);
                }
            };

            rec.onerror = (event) => {
                micBtn.classList.remove('mic-active');
                instruction.innerText = "ไม่ได้ยินเสียง ลองแตะพูดใหม่อีกครั้ง";
                isProcessing = false;
            };

            rec.onend = () => {
                micBtn.classList.remove('mic-active');
                if (!isProcessing) {
                    instruction.innerText = "แตะปุ่มไมค์เพื่อพูดต่อ";
                }
            };

            return rec;
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            const char = charData[levelSelect.value];
            displayName.innerText = char.name;
            avatar.innerText = char.initial;
            avatar.className = `w-10 h-10 rounded-full flex items-center justify-center text-white font-bold ${char.color}`;
            
            // ปปลดล็อค Audio Context สำหรับอุปกรณ์มือถือ
            audioPlayer.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
            audioPlayer.play().catch(() => {});
            
            welcomeScreen.classList.add('hidden');
            appendMessage('bot', char.intro);
        });

        levelSelect.addEventListener('change', () => {
            const char = charData[levelSelect.value];
            displayName.innerText = char.name;
            avatar.innerText = char.initial;
            avatar.className = `w-10 h-10 rounded-full flex items-center justify-center text-white font-bold ${char.color}`;
            chatWindow.innerHTML = '';
            history = [];
            appendMessage('bot', char.intro);
        });

        micBtn.addEventListener('click', () => {
            if (isProcessing) return;

            if (!audioPlayer.paused) {
                audioPlayer.pause();
                audioPlayer.currentTime = 0;
            }

            if (activeRecognition) {
                try {
                    activeRecognition.onstart = null;
                    activeRecognition.onresult = null;
                    activeRecognition.onerror = null;
                    activeRecognition.onend = null;
                    activeRecognition.abort();
                } catch (e) {}
                activeRecognition = null;
            }

            setTimeout(() => {
                activeRecognition = createNewRecognition();
                if (activeRecognition) {
                    try {
                        activeRecognition.start();
                    } catch (e) {
                        micBtn.classList.remove('mic-active');
                        instruction.innerText = "แตะไมค์อีกครั้ง";
                    }
                }
            }, 150);
        });

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `max-w-[85%] p-3.5 rounded-2xl text-sm leading-relaxed ${
                role === 'user' 
                ? 'bg-blue-600 text-white self-end rounded-tr-none shadow-sm' 
                : 'bg-white text-slate-800 self-start border border-slate-100 rounded-tl-none shadow-sm'
            }`;
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
            return div;
        }

        async function sendToAI(message) {
            appendMessage('user', message);
            userTranscript.innerText = "กำลังประมวลผลคำตอบ..."; 
            instruction.innerText = "รอสายตอบกลับ...";
            
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, history, level: levelSelect.value, isEnding: false })
                });
                
                const data = await res.json();

                if (data.text) {
                    appendMessage('bot', data.text);
                    history.push({ role: "user", parts: [{ text: message }] });
                    history.push({ role: "model", parts: [{ text: data.text }] });
                }

                if (data.audio) {
                    playBase64Audio(data.audio);
                }

            } catch (e) { 
                alert("การเชื่อมต่อขัดข้อง กรุณาลองใหม่อีกครั้ง"); 
                console.error(e);
            } finally { 
                isProcessing = false; 
                userTranscript.innerText = "";
                instruction.innerText = "แตะปุ่มไมค์เพื่อพูดต่อ";
            }
        }

        endCallBtn.addEventListener('click', async () => {
            if (history.length < 2) return alert("ยังไม่มีข้อมูลการสนทนาเพียงพอสำหรับการประเมิน");
            
            endCallBtn.innerText = "กำลังประเมิน...";
            endCallBtn.disabled = true;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history, isEnding: true })
                });
                const data = await res.json();
                const evalData = data.evaluation || {};
                const summary = evalData.summary || {};
                
                document.getElementById('eval-modal').classList.remove('hidden');
                document.getElementById('score-val').innerText = evalData.total_score || 0;

                let detailsHTML = `
                    <div class="p-3 bg-green-50 rounded-xl border-l-4 border-green-500 mb-2">
                        <p class="font-bold text-green-800">จุดเด่นในการนำเสนอ:</p>
                        <p class="mt-0.5">${summary.strengths || '-'}</p>
                    </div>
                    <div class="p-3 bg-red-50 rounded-xl border-l-4 border-red-500 mb-2">
                        <p class="font-bold text-red-800">จุดที่ต้องปรับปรุง/Compliance:</p>
                        <p class="mt-0.5">${summary.weaknesses || '-'}</p>
                    </div>
                    <div class="p-2.5 bg-slate-100 rounded-lg flex justify-between items-center text-xs font-semibold mb-3">
                        <span>จำนวนครั้งที่พยายามปิดการขาย:</span>
                        <span class="text-blue-600 font-bold">${summary.closing_attempts_count || 0} ครั้ง</span>
                    </div>
                `;

                if (evalData.evaluation_results && evalData.evaluation_results.length > 0) {
                    detailsHTML += `<div class="border-t pt-3 space-y-2"><p class="font-bold text-slate-700">รายละเอียดตามเกณฑ์ประเมิน:</p>`;
                    evalData.evaluation_results.forEach(item => {
                        const isPass = item.status === 'Pass';
                        detailsHTML += `
                            <div class="p-2.5 rounded-lg border flex flex-col gap-1 ${isPass ? 'bg-slate-50 border-slate-200' : 'bg-red-50/50 border-red-200'}">
                                <div class="flex justify-between items-center font-semibold">
                                    <span class="text-slate-800">${item.item ? item.item + '.' : ''} ${item.topic}</span>
                                    <span class="px-2 py-0.5 rounded text-[10px] ${isPass ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${item.status}</span>
                                </div>
                                ${item.comment ? `<p class="text-[11px] text-slate-500">${item.comment}</p>` : ''}
                            </div>
                        `;
                    });
                    detailsHTML += `</div>`;
                }

                document.getElementById('eval-details').innerHTML = detailsHTML;

            } catch (e) { 
                alert("ระบบประเมินผลขัดข้อง กรุณาลองใหม่อีกครั้ง"); 
                console.error(e);
            } finally { 
                endCallBtn.innerText = "จบการขาย"; 
                endCallBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
